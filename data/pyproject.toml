[project]
name = "pipelines"
version = "0.1.0"
description = "Forecast hazards impact on people and assets."
authors = [{ name = "NRW", email = "ibf-devops@redcross.nl" }]
requires-python = ">=3.12,<4"
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "azure-monitor-opentelemetry",
    "cfgrib",
    "click",
    "eccodes",
    "fiona",
    "netCDF4",
    "numpy",
    "pillow",
    "PyYAML",
    "python-dotenv",
    "rasterio",
    "rasterstats>=0.20.0",
    "requests",
    "scipy",
    "shapely",
    "xarray",
]

[project.scripts]
pipeline = "pipelines.infra.run_forecasts:main"

[project.urls]
Homepage = "https://github.com/rodekruis/NRW/tree/main/pipelines"

[tool.hatch.build.targets.sdist]
include = [
    "pipelines",
    "shared",
]

[tool.hatch.build.targets.wheel]
include = [
    "pipelines",
    "shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "deptry",
    "pyright",
    "ufmt>=2.9.1",
    "pytest",
    "ruff",
    "vulture",
]

[tool.deptry]
known_first_party = ["pipelines", "data_management", "shared"]
# pipelines/deploy/function is a standalone Azure Functions project with its own
# requirements.txt; it is not part of the uv-managed data package. The other
# entries are deptry's defaults, repeated because setting `exclude` overrides
# them (deptry has no extend-exclude option).
exclude = ["^pipelines/deploy/", "^\\.venv", "^\\.git", "^\\.direnv", "^\\.eggs", "^\\.hg", "^\\.mypy_cache", "^\\.nox", "^\\.pants\\.d", "^\\.svn", "^\\.tox", "^__pypackages__", "^_build", "^buck-out", "^build", "^dist", "^node_modules", "^venv"]
per_rule_ignores = { DEP002 = ["cfgrib", "netCDF4", "scipy", "rasterstats", "shapely", "xarray"], DEP004 = ["pytest"] }

[tool.vulture]
# The paths we want vulture to check for dead code.
paths = ["pipelines", "data_management", "shared", "python-knip.py", "vulture_whitelist.py"]
min_confidence = 60
# ISO country code enums: members are looked up dynamically, never referenced by name
exclude = ["shared/country_data.py"]
# Azure Functions entry points are registered via decorators, never called by name
ignore_decorators = ["@app.*"]
ignore_names = [
    # Used to set return values for mock objects. Somewhat unlikely to match non-test code.
    "return_value",
    # Used to set side effects in tests. Somewhat unlikely to match non-test code.
    "side_effect",
    # Property fields for GeoJSON, used as string.
    "ADM?_EN",
    "ADM?_PCODE",
]

[tool.ruff.lint]
# Import sorting is already handled (differently) by ufmt
ignore = ["I001"]

[tool.ruff.lint.per-file-ignores]
"vulture_whitelist.py" = ["F821", "B018"]
